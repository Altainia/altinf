services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

  altinf:
    image: ghcr.io/altainia/altinf:latest
    restart: unless-stopped
    volumes:
      - ./data:/data
      # Production's own Wt config, overriding the baked-in baseline. Edit this
      # file on the host (it is not tracked in git) to configure the app,
      # including Google OAuth; changes survive image updates. The file must
      # exist before starting, or Docker will create a directory in its place.
      - ./wt_config.xml:/app/wt_config.xml
    environment:
      - ALTINF_ADMIN_PASSWORD=${ALTINF_ADMIN_PASSWORD:-}

volumes:
  caddy_data:
